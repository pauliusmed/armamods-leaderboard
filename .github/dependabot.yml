version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      root-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Major upgrades need a migration, not an auto-PR. Handle them deliberately.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # Action majors change behaviour (node runtime, inputs); bump them by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
