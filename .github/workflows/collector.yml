name: Arma Mods Collector

# =============================================================================
# COLLECTOR SWITCH — edit the `enabled=` line in job `collector-gate` only.
# Requires secrets.BATTLEMETRICS_API_KEY (paid BattleMetrics PAT) when true.
# false → all collect/trending jobs skip (no more red 403 failures)
# true  → normal pipeline
# =============================================================================

on:
  schedule:
    - cron: '0 * * * *'  # Hourly; collector-gate skips duplicate fresh runs
  workflow_dispatch:      # Manual trigger — also fired hourly by cron-job.org job 7414079 (:30 UTC, INC-2026-08-27)

jobs:
  collector-gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.switch.outputs.enabled }}
    steps:
      - id: switch
        name: Check collector switch and snapshot freshness
        env:
          HEALTH_URL: https://reforgermods.com/api/health
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error "$HEALTH_URL")"
          node --input-type=module - "$health" <<'NODE'
          import { appendFileSync } from 'node:fs';

          // >>> SWITCH: change false -> true when BM API key is funded <<<
          const collectorEnabled = true;
          const health = JSON.parse(process.argv[2]);
          const checks = [health.checks?.reforger, health.checks?.arma3];
          if (checks.some((check) => !check?.lastUpdate)) {
            throw new Error('Health response is missing a game lastUpdate');
          }

          const cutoff = Date.now() - 75 * 60 * 1000;
          const timestamps = checks.map((check) => Date.parse(check.lastUpdate));
          if (timestamps.some(Number.isNaN)) {
            throw new Error('Health response contains an invalid game lastUpdate');
          }
          const allFresh = timestamps.every((timestamp) => timestamp >= cutoff);
          console.log(`Snapshot freshness: ${allFresh ? 'fresh, skipping duplicate run' : 'stale, running collector'}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${collectorEnabled && !allFresh}\n`);
          NODE

  # Reforger collection (priority - runs first)
  collect-reforger:
    needs: collector-gate
    if: needs.collector-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Reforger collector
        env:
          BATTLEMETRICS_API_KEY: ${{ secrets.BATTLEMETRICS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/collector.ts collect

  # Arma 3 collection (runs after Reforger - uses remaining API quota)
  collect-arma3:
    needs: [collector-gate, collect-reforger]
    if: needs.collector-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Arma 3 collector
        env:
          BATTLEMETRICS_API_KEY: ${{ secrets.BATTLEMETRICS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/collector.ts collect --game=arma3

  # Reforger trending snapshot
  trending-reforger:
    needs: [collector-gate, collect-reforger]
    if: needs.collector-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Reforger trending snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/collector.ts trending

  # Arma 3 trending snapshot (runs after Reforger trending)
  trending-arma3:
    needs: [collector-gate, trending-reforger]
    if: needs.collector-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Arma 3 trending snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/collector.ts trending --game=arma3
