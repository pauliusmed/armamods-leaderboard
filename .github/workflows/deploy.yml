name: Deploy Full Stack (Frontend + Backend)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN secret is NOT set!"
            exit 1
          else
            echo "✅ CLOUDFLARE_API_TOKEN is set"
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID secret is NOT set!"
            exit 1
          else
            echo "✅ CLOUDFLARE_ACCOUNT_ID is set"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ========== DEPLOY (Frontend + API) ==========

      # ========== FRONTEND (Pages) ==========
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: |
          npm run build
          cp -r functions dist/
        env:
          NODE_ENV: production

      - name: Deploy frontend to Cloudflare Pages
        working-directory: web
        run: npx wrangler pages deploy dist --project-name=armamods-leaderboard --commit-dirty=true --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ========== DISCORD RELEASE ANNOUNCEMENT ==========
      # Siunčiama tik tada, kai pasikeitė DISCORD_RELEASES.md (user-facing,
      # angliškas release aprašas). Webhookas nustatomas per
      # secrets.DISCORD_WEBHOOK_URL (kanalas #announcements).
      - name: Announce release to Discord
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "DISCORD_RELEASES.md"; then
            node scripts/post-discord-release.mjs
          else
            echo "No Discord release note — skipping Discord announcement."
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
