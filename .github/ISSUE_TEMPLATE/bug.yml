name: Bug report
description: Something is broken on the site, the API or the collector
title: "[bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems use the [security policy](../security/policy) instead of a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The observed behaviour and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /mods
        2. Sort by size
        3. ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected URL or endpoint
      placeholder: https://reforgermods.com/mod/123
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web UI
        - Worker API
        - Collector / ranking data
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, device, and the game (Reforger or Arma 3).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste console output or attach images. Do not include secrets.
