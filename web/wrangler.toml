# Cloudflare Workers — unified SPA + API (migrated from Pages Functions 2026-08-24)
name = "armamods-leaderboard"
compatibility_date = "2026-08-24"
compatibility_flags = ["nodejs_compat"]
main = "./worker.ts"

# Workers Cache: Cloudflare patarnauja HIT be Worker vykdymo (0 CPU/KV prie HIT).
# Cache API (caches.open) lieka kaip antras sluoksnis — nepriklausoma, nekenkia.
# Rizika: atsakymai be cacheable Cache-Control pridėtų cache-lookup overhead —
# todėl kritiniai API endpointai turi public,max-age (+ stale-while-revalidate).
[cache]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/sitemap.xml", "/sitemap/*", "/mod/*", "/server/*", "/arma3/*", "/og/*", "/badge/*"]

# KV Namespace for mods, servers and history (same as before)
[[kv_namespaces]]
binding = "TRENDING_KV"
id = "a8f21c595e39452e95e7e41e3d812013"

# Per-IP request limiter for page/API routes (bot bursts like 5.9k req/h on one mod page).
# Period must be 10 or 60 s (platform constraint); counters are per Cloudflare location.
[[ratelimits]]
name = "PAGE_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 10

[vars]
ENVIRONMENT = "production"

[observability]
enabled = true
